[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "behaviorlens"
version = "0.1.0"
description = "Evidence-grounded evaluation of behavioral predictions"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
research = ["scikit-learn==1.9.1", "matplotlib==3.11.2"]

[project.scripts]
behaviorlens = "behaviorlens.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
